name: Universal Website Monitoring

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Website/Sitemap URL to monitor'
        required: true
        default: 'https://detailedvehiclehistory.com'
      batch_size:
        description: 'Number of URLs to check in each parallel batch'
        required: false
        default: '50'

jobs:
  discover:
    name: 🔍 Sitemap URL Discovery
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      target_url: ${{ steps.vars.outputs.target_url }}
      batch_size: ${{ steps.vars.outputs.batch_size }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Compile Code
      run: npm run build

    - name: Run Sitemap Discovery
      run: node dist/discover.js "${{ github.event.inputs.target_url || 'https://detailedvehiclehistory.com' }}"

    - name: Calculate Matrix Batches
      id: set-matrix
      env:
        BATCH_SIZE: "${{ github.event.inputs.batch_size || '50' }}"
      run: |
        echo "matrix=$(node dist/generate-matrix.js)" >> $GITHUB_OUTPUT

    - name: Set Configuration Outputs
      id: vars
      run: |
        echo "target_url=${{ github.event.inputs.target_url || 'https://detailedvehiclehistory.com' }}" >> $GITHUB_OUTPUT
        echo "batch_size=${{ github.event.inputs.batch_size || '50' }}" >> $GITHUB_OUTPUT

    - name: Upload Discovered URL List
      uses: actions/upload-artifact@v4
      with:
        name: discovered-urls
        path: discovered_urls.json

  audit:
    name: 🧪 Audit Batch ${{ matrix.batch_index }}
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        batch_index: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Compile Code
      run: npm run build

    - name: Download Discovered URL List
      uses: actions/download-artifact@v4
      with:
        name: discovered-urls
        path: ./

    - name: Execute Playwright Monitor Tests
      env:
        MONITOR_URL: "${{ needs.discover.outputs.target_url }}"
        BATCH_SIZE: "${{ needs.discover.outputs.batch_size }}"
        BATCH_INDEX: "${{ matrix.batch_index }}"
        PLAYWRIGHT_JSON_OUTPUT_NAME: "playwright-report/results-${{ matrix.batch_index }}.json"
      run: |
        npx playwright test --reporter=json,list
      # We override the output file name by copying results.json if generated
      # Playwright writes results to the location configured in playwright.config.ts by default
    
    - name: Rename Result File for Sharding
      if: always()
      run: |
        mkdir -p playwright-report
        if [ -f playwright-report/results.json ]; then
          mv playwright-report/results.json playwright-report/results-${{ matrix.batch_index }}.json
        fi

    - name: Upload Batch Result Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: results-${{ matrix.batch_index }}
        path: playwright-report/results-${{ matrix.batch_index }}.json

    - name: Upload HTML report fragment
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: html-report-${{ matrix.batch_index }}
        path: playwright-report/

  report:
    name: 📊 Consolidate & Notify Slack
    needs: [discover, audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Download All Batch Results
      uses: actions/download-artifact@v4
      with:
        path: playwright-report-temp

    - name: Consolidate Results Directory
      run: |
        mkdir -p playwright-report
        # Find all JSON results-*.json files from downloaded artifacts and move them to playwright-report
        find playwright-report-temp/ -name "results-*.json" -exec cp {} playwright-report/ \;
        ls -la playwright-report/

    - name: Send Slack Notification
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GITHUB_SERVER: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REF: ${{ github.ref_name }}
        GITHUB_SHA_VAL: ${{ github.sha }}
        GITHUB_EVENT: ${{ github.event_name }}
      run: node slack-notify.js
